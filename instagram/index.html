<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IBFE no Instagram</title>
<style>
@font-face{font-family:"Shoulders";src:url(../assets/BigShoulders-Bold.ttf)}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000}
*{box-sizing:border-box;margin:0;padding:0}
#tela{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;font-family:"Inter Display","Inter","Segoe UI",Arial,sans-serif;color:#fff;
  background:linear-gradient(125deg,#4F2A8C 0%,#9A2F8F 38%,#E0395B 68%,#F7883A 100%)}
#tela::before{content:"";position:absolute;left:0;top:0;width:1920px;height:1080px;background:radial-gradient(circle at 18% 20%,rgba(255,255,255,.16),rgba(255,255,255,0) 40%),radial-gradient(circle at 85% 90%,rgba(255,210,120,.25),rgba(255,255,255,0) 45%)}
#coracoes{position:absolute;left:0;top:0;width:1920px;height:1080px}
/* celular */
.cel{position:absolute;left:150px;top:90px;width:500px;height:900px;border-radius:64px;background:#111;padding:20px;box-shadow:0 40px 80px rgba(40,0,40,.45);-webkit-transform:rotate(-4deg);transform:rotate(-4deg)}
.cel .tela{width:100%;height:100%;border-radius:46px;background:#fff;overflow:hidden;color:#111}
.cel .cab{height:96px;display:-webkit-box;display:flex;-webkit-box-align:center;align-items:center;padding:0 24px}
.cel .av{width:56px;height:56px;border-radius:50%;padding:3px;background:linear-gradient(45deg,#F7883A,#E0395B,#9A2F8F)}
.cel .av div{width:100%;height:100%;border-radius:50%;background:#fff url(../assets/logo.png) center/80% no-repeat}
.cel .nm{margin-left:16px;font-weight:800;font-size:24px}
.cel .nm small{display:block;font-weight:500;font-size:18px;color:#777}
.cel .foto{width:460px;height:460px;background:#eee center/cover no-repeat}
.cel .acoes{height:80px;display:-webkit-box;display:flex;-webkit-box-align:center;align-items:center;padding:0 22px}
.cel .acoes svg{margin-right:22px}
.cel .leg{padding:0 24px;font-size:20px;line-height:1.35;color:#222;max-height:150px;overflow:hidden}
.cel .leg b{font-weight:800}
.cor-btn{-webkit-transform-origin:50% 50%;transform-origin:50% 50%;-webkit-animation:bate 1.6s ease-in-out infinite;animation:bate 1.6s ease-in-out infinite}
@-webkit-keyframes bate{0%,100%{-webkit-transform:scale(1)}15%{-webkit-transform:scale(1.3)}30%{-webkit-transform:scale(1)}45%{-webkit-transform:scale(1.18)}60%{-webkit-transform:scale(1)}}
@keyframes bate{0%,100%{transform:scale(1)}15%{transform:scale(1.3)}30%{transform:scale(1)}45%{transform:scale(1.18)}60%{transform:scale(1)}}
/* coração grande sobre a foto */
.big{position:absolute;left:310px;top:330px;width:220px;height:220px;opacity:0;-webkit-animation:curte 4s ease-in-out infinite;animation:curte 4s ease-in-out infinite}
@-webkit-keyframes curte{0%,55%{opacity:0;-webkit-transform:scale(.2)}62%{opacity:1;-webkit-transform:scale(1.15)}68%{-webkit-transform:scale(.95)}74%{-webkit-transform:scale(1.05)}88%{opacity:1;-webkit-transform:scale(1)}100%{opacity:0;-webkit-transform:scale(1)}}
@keyframes curte{0%,55%{opacity:0;transform:scale(.2)}62%{opacity:1;transform:scale(1.15)}68%{transform:scale(.95)}74%{transform:scale(1.05)}88%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
/* texto */
.txt{position:absolute;left:780px;right:110px;top:110px}
.selo{display:inline-block;background:#fff;color:#C2306E;font-weight:900;font-size:28px;letter-spacing:.14em;text-transform:uppercase;padding:12px 26px;border-radius:999px}
.selo i{display:inline-block;width:14px;height:14px;border-radius:50%;background:#E0395B;margin-right:12px;vertical-align:1px;-webkit-animation:pisca 1.2s infinite;animation:pisca 1.2s infinite}
@-webkit-keyframes pisca{50%{opacity:.2}} @keyframes pisca{50%{opacity:.2}}
h1{margin-top:30px;font-family:"Shoulders",sans-serif;font-size:150px;line-height:.88;text-transform:uppercase;text-shadow:0 6px 30px rgba(60,0,40,.3)}
h1 em{font-style:normal;color:#FFE08A}
.sub{margin-top:26px;font-size:40px;font-weight:700;line-height:1.3}
.sub b{font-weight:900}
.qrbox{margin-top:46px;display:-webkit-box;display:flex;-webkit-box-align:center;align-items:center;background:#fff;color:#2A1030;border-radius:30px;padding:22px 34px 22px 22px;width:780px}
.qrbox .qr{width:200px;height:200px;-webkit-box-flex:0;flex:none}
.qrbox .qr svg{width:100%;height:100%;display:block}
.qrbox .t{margin-left:30px}
.qrbox b{display:block;font-weight:900;font-size:40px;line-height:1.1}
.qrbox span{display:block;margin-top:10px;font-size:26px;font-weight:600;color:#7A4A70}
.arroba{position:absolute;right:110px;bottom:60px;font-weight:900;font-size:34px;letter-spacing:.02em;display:-webkit-box;display:flex;-webkit-box-align:center;align-items:center}
.arroba svg{margin-right:14px}
.carregando{position:absolute;left:0;right:0;top:500px;text-align:center;font-size:40px;font-weight:800}
</style></head>
<body>
<div id="tela">
  <canvas id="coracoes" width="1920" height="1080"></canvas>
  <div class="cel"><div class="tela">
    <div class="cab"><div class="av"><div></div></div><div class="nm">ibferibeirao<small>Ribeirão Preto</small></div></div>
    <div class="foto" id="foto"></div>
    <div class="acoes">
      <svg class="cor-btn" width="44" height="44" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.3 3 4.5 6.7 4.5c2.2 0 3.6 1.2 4.3 2.4.7-1.2 2.1-2.4 4.3-2.4 3.7 0 5.8 3.8 4.3 7.3C19.5 16.4 12 21 12 21z" fill="#ED2D58"/></svg>
      <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2"><path d="M21 11.5a8.4 8.4 0 0 1-12.3 7.4L3 21l2.1-5.6A8.5 8.5 0 1 1 21 11.5z"/></svg>
      <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linejoin="round"><path d="M22 3L2 10l8 3 3 8z"/></svg>
    </div>
    <div class="leg" id="leg"></div>
  </div></div>
  <svg class="big" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.3 3 4.5 6.7 4.5c2.2 0 3.6 1.2 4.3 2.4.7-1.2 2.1-2.4 4.3-2.4 3.7 0 5.8 3.8 4.3 7.3C19.5 16.4 12 21 12 21z" fill="#fff" stroke="rgba(0,0,0,.08)" stroke-width=".5"/></svg>
  <div class="txt">
    <div class="selo" id="selo"><i></i>Post novo</div>
    <h1 id="titulo">Você já curtiu<br><em>nosso post?</em></h1>
    <div class="sub" id="sub"></div>
    <div class="qrbox"><div class="qr" id="qr"></div><div class="t"><b id="qrt">Curta, comente<br>e compartilhe!</b><span id="qrs">Aponte a câmera do celular</span></div></div>
  </div>
  <div class="arroba"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="#fff"/></svg>@ibferibeirao</div>
  <div class="carregando" id="carregando">Carregando…</div>
</div>
<script>
var DIAS_NOVO = 3;
function $(id){ return document.getElementById(id); }
function parametro(n){ var m=new RegExp("[?&]"+n+"=([^&]+)").exec(location.search); return m?decodeURIComponent(m[1]):null; }
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
function ajusta(){
  var ws=[window.innerWidth,document.documentElement.clientWidth,screen.width], hs=[window.innerHeight,document.documentElement.clientHeight,screen.height], W=0,H=0,k;
  for(k=0;k<ws.length;k++) if(ws[k]>100&&(!W||ws[k]<W)) W=ws[k];
  for(k=0;k<hs.length;k++) if(hs[k]>100&&(!H||hs[k]<H)) H=hs[k];
  if(!W)W=1920; if(!H)H=1080;
  var s=Math.min(W/1920,H/1080), f=parseFloat(parametro("escala")); if(f>0)s=f;
  var t=$("tela"), tr="scale("+s+")"; t.style.webkitTransform=tr; t.style.transform=tr; t.style.webkitTransformOrigin="0 0"; t.style.transformOrigin="0 0";
  t.style.left=Math.max(0,(W-1920*s)/2)+"px"; t.style.top=Math.max(0,(H-1080*s)/2)+"px";
}
window.onresize=ajusta; ajusta(); setInterval(ajusta,2000);

/* corações subindo */
var cv=$("coracoes"), ctx=cv.getContext("2d"), cs=[];
for(var i=0;i<26;i++) cs.push({x:Math.random()*1920,y:1080+Math.random()*1080,s:14+Math.random()*30,v:0.6+Math.random()*1.4,f:Math.random()*6.28,a:0.15+Math.random()*0.35});
function coracao(x,y,s){ ctx.beginPath(); ctx.moveTo(x,y+s*0.35); ctx.bezierCurveTo(x,y,x-s*0.5,y,x-s*0.5,y+s*0.35); ctx.bezierCurveTo(x-s*0.5,y+s*0.65,x,y+s*0.8,x,y+s); ctx.bezierCurveTo(x,y+s*0.8,x+s*0.5,y+s*0.65,x+s*0.5,y+s*0.35); ctx.bezierCurveTo(x+s*0.5,y,x,y,x,y+s*0.35); ctx.fill(); }
var req=window.requestAnimationFrame||window.webkitRequestAnimationFrame||function(f){setTimeout(f,33);};
function anima(){ ctx.clearRect(0,0,1920,1080);
  for(var i=0;i<cs.length;i++){ var c=cs[i]; c.y-=c.v; c.f+=0.02; if(c.y<-60){c.y=1100;c.x=Math.random()*1920;}
    ctx.fillStyle="rgba(255,255,255,"+c.a+")"; coracao(c.x+Math.sin(c.f)*24,c.y,c.s); }
  req(anima); }
anima();

function ha(iso){ var h=(new Date()-new Date(iso))/36e5; if(h<1) return "há poucos minutos"; if(h<24) return "há "+Math.floor(h)+"h"; var d=Math.floor(h/24); return d===1?"ontem":"há "+d+" dias"; }
function pinta(j){
  $("carregando").style.display="none";
  var p=j.post, novo=p && ((new Date()-new Date(p.data))/864e5 <= DIAS_NOVO);
  if(p){
    $("foto").style.backgroundImage=p.imagem?"url('"+p.imagem+"?v="+encodeURIComponent(p.id)+"')":"";
    var leg=esc(p.legenda).replace(/\n+/g," ");
    $("leg").innerHTML="<b>ibferibeirao</b> "+(leg.length>150?leg.slice(0,150)+"…":leg);
  }
  if(novo){
    $("selo").innerHTML="<i></i>Post novo · "+ha(p.data);
    $("titulo").innerHTML="Você já curtiu<br><em>nosso post?</em>";
    $("sub").innerHTML="Tem novidade no nosso Instagram. <b>Passa lá e deixa seu like!</b>";
    $("qr").innerHTML=p.qr; $("qrt").innerHTML="Curta, comente<br>e compartilhe!"; $("qrs").innerHTML="Aponte a câmera do celular";
  } else {
    $("selo").innerHTML="<i></i>Instagram";
    $("titulo").innerHTML="Siga o IBFE<br><em>no Instagram</em>";
    $("sub").innerHTML="Dicas, novidades dos cursos e bastidores. <b>Fique por dentro!</b>";
    $("qr").innerHTML=j.qr_perfil; $("qrt").innerHTML="@ibferibeirao"; $("qrs").innerHTML="Aponte a câmera e siga";
  }
}
function carrega(){ var x=new XMLHttpRequest(); x.open("GET","post.json?t="+new Date().getTime(),true);
  x.onload=function(){ try{ pinta(JSON.parse(x.responseText)); }catch(e){} }; x.send(); }
carrega(); setInterval(carrega, 15*60*1000);
</script>
</body></html>
