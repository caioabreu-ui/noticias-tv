name: Verificar dicas da TV
on:
  schedule:
    - cron: "0 9 * * *"        # todo dia, 6h da manhã (Brasília)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["dicas/dicas.json", "dicas/gerar_dicas.py", ".github/workflows/dicas.yml"]
permissions:
  contents: write
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install qrcode
      - run: python dicas/gerar_dicas.py
      - name: Salvar
        run: |
          git config user.name "robo-tv-ibfe"
          git config user.email "robo@users.noreply.github.com"
          git pull --rebase
          git add dicas/dicas_saida.json
          git diff --cached --quiet || git commit -m "Dicas verificadas"
          git push
