name: Buscar post do Instagram
on:
  schedule:
    - cron: "15 * * * *"        # a cada hora
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["instagram/gerar_insta.py", ".github/workflows/instagram.yml"]
permissions:
  contents: write
jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install qrcode
      - run: python instagram/gerar_insta.py
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
      - name: Salvar
        run: |
          git config user.name "robo-tv-ibfe"
          git config user.email "robo@users.noreply.github.com"
          git add instagram/post.json instagram/post.jpg 2>/dev/null || git add instagram/post.json
          git diff --cached --quiet && exit 0
          git commit -m "Post do Instagram atualizado"
          git pull --rebase -X ours origin main
          git push
