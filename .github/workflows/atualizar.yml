name: Atualizar notícias da TV
on:
  schedule:
    - cron: "*/30 * * * *"      # a cada 30 minutos
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["gerar_feed.py", "fontes.json", ".github/workflows/**"]
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install feedparser qrcode
      - run: python gerar_feed.py
      - name: Salvar noticias.json
        run: |
          git config user.name "robo-tv-ibfe"
          git config user.email "robo@users.noreply.github.com"
          git add noticias.json
          git diff --cached --quiet && exit 0
          git commit -m "Notícias atualizadas"
          git pull --rebase -X ours origin main
          git push
