<div id="viewport">
    <div id="stage" aria-label="Teaser BIA 1920x1080">
      <!-- Fundo -->
      <div class="layer" id="bg">
        <div id="bg-glow"></div>
        <div id="bg-glow2"></div>
        <div id="grid"></div>
        <div id="particles"></div>
        <svg id="rings" viewBox="0 0 1920 1080" width="1920" height="1080">
          <circle id="ring1" cx="960" cy="540" r="300" fill="none" stroke="#2387F5" stroke-width="2"/>
          <circle id="ring2" cx="960" cy="540" r="380" fill="none" stroke="#FFFFFF" stroke-opacity=".18" stroke-width="1.5"/>
          <circle id="ringDot" cx="960" cy="160" r="9" fill="#2387F5"/>
        </svg>
        <div class="sweep" id="sweep1"></div>
        <div class="sweep" id="sweep2"></div>
        <div class="sweep" id="sweep3"></div>
      </div>

      <!-- Cena 3D (dispositivos) -->
      <div class="layer" id="scene3d">
        <div id="laptop" class="device">
          <div class="lap-screen">
            <div class="lap-display">
              <div class="ui-layer" id="ui-painel"><img alt=""><div class="hl" id="hl-painel"></div></div>
              <div class="ui-layer" id="ui-biblio"><img alt=""><div class="hl" id="hl-biblio"></div></div>
              <div class="ui-layer" id="ui-notas"><img alt=""><div class="hl" id="hl-notas"></div></div>
              <div class="glare"></div>
            </div>
          </div>
          <div class="lap-base"><div class="lap-notch"></div></div>
          <div class="lap-shadow"></div>
        </div>

        <div id="phoneB" class="device phone"><img alt=""></div>
        <div id="phoneA" class="device phone"><img alt=""><div class="hl" id="hl-notasA"></div><div class="hl" id="hl-entregarA"></div><div class="hl" id="hl-tabA"></div></div>

        <div id="biblioCard" class="device"><img alt=""></div>
      </div>

      <!-- Etiquetas -->
      <div class="layer" id="chips">
        <div class="chip" id="chip-painel"><i></i><span></span></div>
        <div class="chip" id="chip-materiais"><i></i><span></span></div>
        <div class="chip" id="chip-navegacao"><i></i><span></span></div>
        <div class="chip" id="chip-notas"><i></i><span></span></div>
        <div class="chip" id="chip-trabalhos"><i></i><span></span></div>
        <div class="chip" id="chip-biblio"><i></i><span></span></div>
        <div class="chip" id="chip-perfis"><i></i><span></span></div>
      </div>

      <!-- Títulos -->
      <div class="layer" id="titles">
        <div class="headline center" id="h-suspense"></div>
        <div class="headline left" id="h-plataforma"></div>
        <div class="headline left" id="h-func"></div>
        <div class="headline center" id="h-conv"></div>
        <div class="headline center big" id="h-final"></div>
      </div>

      <!-- Revelação BIA -->
      <div class="layer" id="reveal">
        <div id="bia-logo"></div>
      </div>

      <!-- Assinatura EnvolveLabs -->
      <div class="layer" id="sign">
        <div id="env-wrap">
          <img id="env-symbol" alt="EnvolveLabs">
          <img id="env-name" alt="">
        </div>
      </div>

      <div class="layer" id="flash"></div>
      <div class="layer" id="fade"></div>
    </div>
</div>
